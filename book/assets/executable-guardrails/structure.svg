<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">Executable guardrails</title><desc id="desc">An agent action passes through an executable policy. Safe actions run, dangerous actions are blocked, and ambiguous actions are escalated. Results pass through verification.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.t{font:700 25px system-ui;fill:#172033}.h{font:700 18px system-ui;fill:#172033}.s{font:15px system-ui;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1240" height="520" rx="24" fill="#f8fafc"/><text x="620" y="45" text-anchor="middle" class="t">Advice guides decisions; executable policy enforces boundaries</text>
  <rect x="40" y="185" width="190" height="110" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="135" y="225" text-anchor="middle" class="h">Agent action</text><text x="135" y="257" text-anchor="middle" class="s">tool + arguments</text><path d="M230 240H310" class="l"/>
  <rect x="310" y="145" width="260" height="190" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="440" y="185" text-anchor="middle" class="h">Executable policy</text><text x="440" y="222" text-anchor="middle" class="s">sandbox · permissions</text><text x="440" y="250" text-anchor="middle" class="s">pre-tool hook · allowlist</text><text x="440" y="290" text-anchor="middle" class="s">allow / deny / ask</text>
  <path d="M570 190H690" class="l"/><path d="M570 240H690" class="l"/><path d="M570 290H690" class="l"/>
  <rect x="690" y="105" width="190" height="70" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="785" y="148" text-anchor="middle" class="h">Run safely</text>
  <rect x="690" y="205" width="190" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="785" y="248" text-anchor="middle" class="h">Block + explain</text>
  <rect x="690" y="305" width="190" height="70" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="785" y="348" text-anchor="middle" class="h">Ask a human</text>
  <path d="M880 140H950V240H990" class="l"/><rect x="990" y="185" width="210" height="110" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1095" y="225" text-anchor="middle" class="h">Result gate</text><text x="1095" y="257" text-anchor="middle" class="s">tests · CI · audit</text>
  <text x="620" y="475" text-anchor="middle" class="s">Keep the safe area broad and the enforced invariants small, deterministic, and testable</text>
</svg>
