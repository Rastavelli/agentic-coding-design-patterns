<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible agent bootstrap</title><desc id="desc">A fresh session runs one bootstrap command that validates prerequisites, prepares isolated local state, and runs a smoke check before work starts.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.t{font:700 25px system-ui;fill:#172033}.h{font:700 18px system-ui;fill:#172033}.s{font:15px system-ui;fill:#334155}.c{font:15px ui-monospace,monospace;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1240" height="500" rx="24" fill="#f8fafc"/><text x="620" y="45" text-anchor="middle" class="t">One command turns unknown local state into a proven green baseline</text>
  <rect x="35" y="170" width="190" height="120" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="130" y="210" text-anchor="middle" class="h">Fresh session</text><text x="130" y="242" text-anchor="middle" class="s">unknown state</text><text x="130" y="270" text-anchor="middle" class="c">make setup</text><path d="M225 230H285" class="l"/>
  <rect x="285" y="135" width="210" height="190" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="390" y="175" text-anchor="middle" class="h">Validate</text><text x="390" y="213" text-anchor="middle" class="s">runtime versions</text><text x="390" y="243" text-anchor="middle" class="s">required tools</text><text x="390" y="273" text-anchor="middle" class="s">locked dependencies</text><path d="M495 230H555" class="l"/>
  <rect x="555" y="135" width="220" height="190" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="665" y="175" text-anchor="middle" class="h">Prepare</text><text x="665" y="213" text-anchor="middle" class="s">safe config</text><text x="665" y="243" text-anchor="middle" class="s">fixtures + migrations</text><text x="665" y="273" text-anchor="middle" class="s">isolated resources</text><path d="M775 230H835" class="l"/>
  <rect x="835" y="155" width="170" height="150" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="920" y="198" text-anchor="middle" class="h">Smoke check</text><text x="920" y="235" text-anchor="middle" class="s">real interface</text><text x="920" y="265" text-anchor="middle" class="s">clear exit code</text><path d="M1005 230H1055" class="l"/>
  <rect x="1055" y="175" width="150" height="110" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1130" y="215" text-anchor="middle" class="h">Green</text><text x="1130" y="250" text-anchor="middle" class="s">start the task</text>
  <text x="620" y="445" text-anchor="middle" class="s">Any failure before green belongs to setup; any new failure after green belongs to the change</text>
</svg>
