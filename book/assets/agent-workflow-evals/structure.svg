<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="title desc">
  <title id="title">Agent workflow evals</title><desc id="desc">A versioned task suite is run through an agent workflow multiple times. Outcome and trajectory graders produce a report compared with a baseline.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>.t{font:700 25px system-ui;fill:#172033}.h{font:700 18px system-ui;fill:#172033}.s{font:15px system-ui;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1240" height="540" rx="24" fill="#f8fafc"/><text x="620" y="45" text-anchor="middle" class="t">Run the same tasks, grade outcomes and trajectories, compare to baseline</text>
  <rect x="40" y="155" width="220" height="210" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="150" y="195" text-anchor="middle" class="h">Versioned task suite</text><text x="150" y="235" text-anchor="middle" class="s">prompt</text><text x="150" y="265" text-anchor="middle" class="s">clean fixture</text><text x="150" y="295" text-anchor="middle" class="s">success criteria</text><text x="150" y="325" text-anchor="middle" class="s">multiple trials</text><path d="M260 260H340" class="l"/>
  <rect x="340" y="175" width="230" height="170" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="455" y="215" text-anchor="middle" class="h">Agent workflow</text><text x="455" y="253" text-anchor="middle" class="s">instructions + model</text><text x="455" y="283" text-anchor="middle" class="s">tools + permissions</text><text x="455" y="313" text-anchor="middle" class="s">record transcript</text><path d="M570 260H610V175H650" class="l"/><path d="M570 260H610V345H650" class="l"/>
  <rect x="650" y="115" width="230" height="120" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="765" y="155" text-anchor="middle" class="h">Outcome graders</text><text x="765" y="190" text-anchor="middle" class="s">tests · diff · state</text>
  <rect x="650" y="285" width="230" height="120" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="765" y="325" text-anchor="middle" class="h">Trajectory graders</text><text x="765" y="360" text-anchor="middle" class="s">scope · tools · cost</text>
  <path d="M880 175H940V245H990" class="l"/><path d="M880 345H940V275H990" class="l"/><rect x="990" y="190" width="210" height="140" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="1095" y="230" text-anchor="middle" class="h">Comparison report</text><text x="1095" y="265" text-anchor="middle" class="s">baseline vs candidate</text><text x="1095" y="297" text-anchor="middle" class="s">quality · variance · cost</text>
  <text x="620" y="490" text-anchor="middle" class="s">A failed real task becomes a stable regression case, not an anecdote</text>
</svg>
